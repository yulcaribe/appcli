name: H298A APCLI candidates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Cross-compile Linux 2.6.36 MIPS big-endian Wi-Fi drivers
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout appcli project
        uses: actions/checkout@v4
      - name: Install host utilities and big-endian MIPS cross-compiler
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git build-essential make python3 gcc-mips-linux-gnu \
            binutils-mips-linux-gnu bison flex libncurses-dev \
            bc libssl-dev file ca-certificates
          mips-linux-gnu-gcc --version | head -1
      - name: Fetch pinned vendor source, enable APCLI and compile candidates
        id: compile
        run: bash scripts/build.sh
      - name: Upload build logs and candidate kernel modules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h298a-apcli-build-${{ github.run_number }}
          path: build-results/
          if-no-files-found: warn
          retention-days: 30