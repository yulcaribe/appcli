name: Preserve V7 experimental binary from known Actions artifact
on:
  push:
    branches: [restructure/h298-repeater-20261016]
    paths:
      - '.github/workflows/import-v7-temporary.yml'
permissions:
  actions: read
  contents: write
jobs:
  import-v7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download previously built V7 artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 38826661215
          name: h298-mt7603e-bsp-apcli-experimental-ko
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact
      - name: Verify V7 and preserve in staging branch
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '016046fb7193680a300f5f80b4855b2574c60d3e0f1bf92e5d39b468ee1dbf4c  artifact/mt7603eap.ko' | sha256sum -c -
          mkdir -p driver
          cp artifact/mt7603eap.ko driver/mt7603eap_v7.ko
          rm -rf artifact
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add driver/mt7603eap_v7.ko
          git commit -m 'Archive exact V7 experimental mt7603eap.ko' || exit 0
          git push origin HEAD:restructure/h298-repeater-20261016
